name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Validate security baseline
        run: python3 scripts/validate_security_baseline.py

      - name: Validate repository bootstrap
        shell: bash
        run: |
          set -euo pipefail

          test -s README.md
          test -s LICENSE
          test -s SECURITY.md
          test -s docs/repository-boundary.md
          test -s .github/CODEOWNERS
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s .github/dependabot.yml

          grep -q "production-backend" README.md
          grep -q "production-backend" docs/repository-boundary.md
          grep -q "@ramideltoro" .github/CODEOWNERS

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Validate package
        run: npm run ci
