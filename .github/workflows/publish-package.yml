name: Publish Package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Package version from package.json to publish, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-package:
    name: publish-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@ramideltoro"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Validate package
        env:
          NUTSNEWS_REQUIRE_PUBLISHED_CONTRACT_LOCK: "true"
        run: npm run ci

      - name: Verify release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ -n "${RELEASE_TAG:-}" && "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          fi

          if [[ -n "${DISPATCH_VERSION:-}" && "${DISPATCH_VERSION}" != "${package_version}" ]]; then
            echo "Dispatch version ${DISPATCH_VERSION} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Reject already-published version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/tmp/published-version 2>/dev/null; then
            echo "${package_name}@${package_version} is already published and immutable." >&2
            exit 1
          fi

      - name: Pack package
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          npm pack --json > /tmp/npm-pack.json
          filename="$(node -e 'const fs = require("fs"); const [result] = JSON.parse(fs.readFileSync("/tmp/npm-pack.json", "utf8")); console.log(result.filename);')"
          test -s "${filename}"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"

      - name: Attest package tarball
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d  # v4
        with:
          subject-path: ${{ steps.pack.outputs.filename }}

      - name: Publish immutable package version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.filename }}" --access public
