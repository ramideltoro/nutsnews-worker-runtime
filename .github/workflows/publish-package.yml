name: Publish Package

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-package:
    name: publish-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect package manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package.json ]]; then
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip until package exists
        if: steps.manifest.outputs.has_manifest != 'true'
        run: echo "No package.json is present yet."

      - name: Setup Node.js
        if: steps.manifest.outputs.has_manifest == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@ramideltoro"

      - name: Install dependencies
        if: steps.manifest.outputs.has_manifest == 'true'
        run: npm ci

      - name: Build
        if: steps.manifest.outputs.has_manifest == 'true'
        run: npm run build --if-present

      - name: Publish immutable package version
        if: steps.manifest.outputs.has_manifest == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --provenance --access public
